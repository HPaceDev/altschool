# Развёртывание на своём сервере одной командой: docker compose up -d --build
#
# База инициализируется автоматически из drizzle/bootstrap.sql при первом
# запуске: отдельно накатывать миграции и наполнять данными не нужно.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в файле .env}
      POSTGRES_DB: portal
    volumes:
      - db-data:/var/lib/postgresql/data
      # Скрипты из этого каталога выполняются только при создании базы,
      # то есть ровно один раз. Перезапуск контейнера данные не тронет.
      - ./drizzle/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется: база доступна только приложению.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
      APP_URL: ${APP_URL:?укажите адрес портала в файле .env}
    ports:
      # По умолчанию только localhost сервера: снаружи портал отдаёт Caddy.
      # В режиме работы по IP без сертификата установщик ставит сюда
      # 0.0.0.0:80 и не поднимает Caddy вовсе — тогда на 443 никто не слушает,
      # и браузер, попробовав https, сам возвращается на http.
      - "${APP_BIND:-127.0.0.1:3000}:3000"
    networks:
      default:
        # Собственное имя в сети вместо короткого «app». На сервере рядом
        # живут и другие проекты; если у соседа сервис тоже называется app и
        # сети пересеклись, DNS Docker отдаёт оба контейнера, и Caddy начинает
        # проксировать запросы то нам, то соседу. С уникальным именем это
        # невозможно.
        aliases:
          - portal-app

  # HTTPS с автоматическим сертификатом. Включается профилем:
  #   docker compose --profile tls up -d
  # Без профиля поднимаются только приложение и база — удобно, когда
  # сертификатами занимается уже настроенный на сервере nginx.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: "${DOMAIN:?укажите DOMAIN в .env — имя домена для профиля tls либо :80 для работы по IP}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Выданные сертификаты переживают перезапуск: без этого тома Let's
      # Encrypt быстро упрётся в ограничение на число выдач для домена.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
