# Развёртывание на своём сервере одной командой: docker compose up -d --build
#
# База инициализируется автоматически из drizzle/bootstrap.sql при первом
# запуске: отдельно накатывать миграции и наполнять данными не нужно.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в файле .env}
      POSTGRES_DB: portal
    volumes:
      - db-data:/var/lib/postgresql/data
      # Скрипты из этого каталога выполняются только при создании базы,
      # то есть ровно один раз. Перезапуск контейнера данные не тронет.
      - ./drizzle/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется: база доступна только приложению.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal
      AUTH_SECRET: ${AUTH_SECRET:?задайте AUTH_SECRET в файле .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?укажите адрес портала в файле .env}
      OWNER_EMAIL: ${OWNER_EMAIL:?укажите свою почту в файле .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      # Наружу отдаётся только localhost сервера: HTTPS терминируется
      # nginx или Caddy, они же проксируют на этот порт.
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
